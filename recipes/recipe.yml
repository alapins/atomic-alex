---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# DESKTOP image -> ghcr.io/alapins/atomic-alex
# Shared modules live in recipes/common/*.yml and are pulled in with from-file.
# Anything that should exist ONLY on the desktop goes inline in this file.
name: atomic-alex
description: This is my personal OS image (desktop).

base-image: ghcr.io/ublue-os/aurora-dx
image-version: stable # latest is also supported if you want new updates ASAP

# module configuration, executed in order
modules:
  - from-file: common/system.yml
  - from-file: common/dnf.yml

  # --- DESKTOP-ONLY dnf packages (add a dnf module here when needed) ---

  - from-file: common/flatpaks.yml

  # --- DESKTOP-ONLY flatpaks ---
  # - type: default-flatpaks
  #   configurations:
  #     - scope: system
  #       install:
  #         - com.example.DesktopOnlyApp

  - from-file: common/finalize.yml
