---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: atomic-alex
# description will be included in the image's metadata
description: This is my personal OS image.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/aurora-dx
image-version: stable # latest is also supported if you want new updates ASAP

# module configuration, executed in order
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: chezmoi
    repository: "https://github.com/alapins/dotfiles"
    file-conflict-policy: replace # override changed files with those from the repo

  - type: dnf
    repos:
      copr:
        - scottames/ghostty
        - atim/nushell
        - ryanabx/cosmic-epoch
      files:
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
        - https://download.opensuse.org/repositories/home:Kernalix7/Fedora_%OS_VERSION%/home:Kernalix7.repo
      keys:
        - https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
      nonfree: rpmfusion
    install:
      packages:
        - brave-browser
        - winpodx
        - https://dl.google.com/linux/direct/google-chrome-stable_current_x86_64.rpm
        - uxplay
        - nautilus-dropbox
        - ghostty
        - nushell
        - cosmic-desktop
        - neovim
        - syncthing
        - emacs

  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install: # system flatpaks we want all users to have and not remove
          # Media Creation
          - org.audacityteam.Audacity
          - org.gimp.GIMP
          - org.inkscape.Inkscape
          - org.kde.krita
          - com.obsproject.Studio
          # Media Players
          - tv.plex.PlexDesktop
          - com.plexamp.Plexamp
          - org.videolan.VLC
          - us.zoom.Zoom
          - com.discordapp.Discord
          - com.yacreader.YACReader
          - org.flameshot.Flameshot # screenshot
          - org.keepassxc.KeePassXC
          - md.obsidian.Obsidian
          - com.getpostman.Postman
          - io.github.pwr_solaar.solaar # Logitech mouse driver
          - it.mijorus.gearlever
          - org.onlyoffice.desktopeditors
          - org.localsend.localsend_app
      - scope: user # Also add Flathub user repo, but no user packages

  # appsync tools baked into the image: the Go (mikefarah) yq required by
  # ~/.config/appsync/install.sh, plus topgrade. NOTE: Fedora's dnf `yq` is a
  # different, incompatible tool (python jq-wrapper), so we install the real
  # binaries from upstream releases instead.
  - type: script
    scripts:
      - install-appsync-tools.sh

  - type: signing # this sets up the proper policy & signing files for signed images to work fully

  - type: systemd
    system:
      enabled:
        - cosmic-greeter.service
