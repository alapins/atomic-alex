name: keepalive
# GitHub disables scheduled workflows after 60 days without repo commits
# (state: disabled_inactivity), which silently stops the daily image build.
# Re-enabling the workflow through the API resets that timer, so no commits needed.
on:
  schedule:
    - cron: "17 08 1,15 * *" # 1st and 15th of each month
  workflow_dispatch:
permissions:
  actions: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable build workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable build.yml --repo "${{ github.repository }}"
